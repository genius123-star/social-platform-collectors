<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Instagram研究采集</title>
<style>body{font:14px sans-serif;width:370px;padding:12px}p{line-height:1.6}button,select{width:100%;padding:8px;margin:4px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer;padding:8px}</style>
<h3>Instagram研究采集 v0.4.2</h3>
<p>研究期间：北京时间2025-10-17至2026-10-17。正式任务每次最长30分钟，可恢复；每帖最多20次评论/回复展开。后台冻结时不保证推进。</p>
<label for="account">目标账号</label><select id="account"><option>dailyvideo.kg</option><option>chinaarabtv</option></select>
<button id="formal">从主页顶部新建正式任务</button><button id="here">从当前位置新建正式任务（上方未覆盖）</button>
<label for="runs">已保存任务（恢复与导出均使用此任务）</label><select id="runs"></select>
<button id="resume">恢复所选任务（优先原地）</button><button id="pause">暂停并保留断点</button><button id="stop">停止并解除自动恢复</button>
<button id="supplement">新建所选任务的期间内评论补采（保留原任务）</button>
<button id="refresh">更新状态</button><pre id="run-status" role="status"></pre><p id="capacity"></p>
<button id="profiles">导出所选任务：账号资料快照</button><button id="posts">导出所选任务：帖子表</button><button id="observations">导出所选任务：评论观察表（可能重复）</button>
<button id="comments">导出所选任务：有ID唯一评论表</button><button id="report">导出所选任务：运行报告</button><button id="export">导出所选任务：原始证据（自动分段）</button>
<details><summary>试采与诊断</summary><button id="start">新建10帖试采</button><button id="next">所选试采任务继续下一批10帖</button>
<button id="capture">手动保存当前页面证据</button><button id="legacy">导出当前账号全部旧证据（含历史任务）</button><button id="diagnose">导出当前与运行读取器诊断</button></details>
<details><summary>归档与释放容量</summary><label><input id="archive-confirm" type="checkbox">我已核对所选任务的全部原始证据分段及可读表下载完成</label><button id="archive">清除所选任务的本机新格式快照（保留断点；不可撤销）</button></details>
<p>缺失不等于0；达到预算不等于全部采完。关闭弹窗可继续，停止后可导出。不读取密码、Cookie或私信，不自动点赞、关注或发布。</p>
<pre id="status" role="status">旧数据保留，升级后需核对运行版本。</pre><script src="data.js"></script><script src="popup.js"></script></html>
